spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  datasource:
    url: jdbc:mysql://localhost:3306/realestate_dev
    username: root
    password: root
  
  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.realestate: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
